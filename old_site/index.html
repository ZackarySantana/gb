<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>gb • benchmarks</title>
  <style>
    :root {
      /* Dark theme colors */
      --bg-primary: #0a0a0a;
      --bg-secondary: #111111;
      --bg-tertiary: #1a1a1a;
      --bg-card: #141414;
      --bg-hover: #1f1f1f;

      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --text-muted: #666666;
      --text-accent: #3b82f6;

      --border-primary: #2a2a2a;
      --border-secondary: #333333;
      --border-focus: #3b82f6;

      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);

      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      padding: 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title-link {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      font: inherit;
    }

    .title-link:hover {
      text-decoration: none;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: all 0.2s ease;
    }

    .title-link:hover .title {
      background: linear-gradient(135deg, var(--text-accent) 0%, var(--text-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .repo-link {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .repo-link:hover {
      color: var(--text-accent);
      text-decoration: none;
    }

    .header-info {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .loading {
      color: var(--text-muted);
      font-style: italic;
    }

    .main {
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
    }

    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .section-header h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }

    .section-filters {
      display: flex;
      gap: 16px;
      align-items: end;
      flex-wrap: wrap;
    }

    .section-filter {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .card:hover {
      border-color: var(--border-secondary);
      box-shadow: var(--shadow-md);
    }

    .filter-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .filter-input,
    .filter-select {
      padding: 10px 12px;
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.2s ease;
      min-width: 0;
      cursor: pointer;
    }

    .filter-select {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 8px center;
      background-repeat: no-repeat;
      background-size: 16px;
      padding-right: 32px;
      appearance: none;
    }

    .filter-select option {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      padding: 8px;
    }

    .filter-select option[value=""] {
      color: var(--text-muted);
      font-style: italic;
    }

    .filter-input:focus,
    .filter-select:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .filter-input::placeholder {
      color: var(--text-muted);
    }


    /* Run Summary */
    .run-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .commit-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .commit-link {
      color: var(--text-accent);
      text-decoration: none;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 16px;
      font-weight: 600;
      padding: 8px 12px;
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md);
      background: var(--bg-tertiary);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
    }

    .commit-link:hover {
      background: var(--bg-hover);
      border-color: var(--border-focus);
      text-decoration: none;
      color: var(--text-accent);
    }

    .created-time {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
    }

    .more-info-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      padding: 8px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .more-info-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-focus);
      color: var(--text-primary);
    }

    .more-info {
      margin-bottom: 16px;
      padding: 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md);
    }

    .info-section {
      margin-bottom: 16px;
    }

    .info-section:last-child {
      margin-bottom: 0;
    }

    .info-section h4 {
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .info-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .info-value {
      color: var(--text-secondary);
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
    }

    .bench-args {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 13px;
      color: var(--text-secondary);
      word-break: break-all;
    }

    /* Table */
    .table-container {
      overflow-x: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-primary);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-tertiary);
    }

    th {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-primary);
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-primary);
      color: var(--text-primary);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background: var(--bg-hover);
    }

    .benchmark-name {
      font-weight: 500;
      color: var(--text-primary);
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 13px;
    }

    .metric-name {
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .value {
      font-weight: 600;
      color: var(--text-primary);
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 14px;
    }

    .delta {
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .delta.positive {
      color: var(--error);
    }

    .delta.negative {
      color: var(--success);
    }

    .delta.neutral {
      color: var(--text-muted);
    }

    /* Trend Section */
    .trend-section {
      margin-top: 8px;
    }

    .cursor-info {
      margin-top: 12px;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md);
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      gap: 16px;
      min-height: 32px;
      align-items: center;
    }

    /* uPlot overrides */
    .uplot {
      font-family: inherit;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    .u-title {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 16px;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    .u-legend {
      color: var(--text-secondary);
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    .u-select {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid var(--border-focus);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header-content {
        padding: 12px 16px;
      }

      .main {
        padding: 16px;
      }

      .title {
        font-size: 20px;
      }

      .section-filters {
        flex-direction: column;
        gap: 12px;
      }

      .run-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .commit-info {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .commit-link {
        font-size: 14px;
        padding: 6px 10px;
      }

      .more-info-btn {
        font-size: 13px;
        padding: 6px 10px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .table-container {
        font-size: 13px;
      }

      th,
      td {
        padding: 8px 12px;
      }

      .benchmark-name {
        font-size: 12px;
      }

      .value {
        font-size: 13px;
      }
    }

    @media (max-width: 480px) {
      .main {
        padding: 12px;
      }

      .filters-card,
      .card {
        padding: 16px;
      }

      .run-date {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
